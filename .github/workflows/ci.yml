name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # x64 and arm64: drawings must come out byte-identical on both
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npm run lint:package
